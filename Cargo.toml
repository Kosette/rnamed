[package]
name = "rnamed"
version = "1.1.2"
edition = "2021"
authors = ["Kosette"]
description = "A simple tool to rename files to their checksum"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
glob = "0.3"
indicatif = { version = "0.17", features = ["rayon"] }
md-5 = "0.10"
rayon = "1.10"
sha2 = "0.10"
